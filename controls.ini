; =============================================================================
;  Better Flight - control scheme
;
;  Single source of truth. Read by:
;    controls_mod.py    remap section   - moves vanilla actions (data mod)
;    BetterFlight.dll   flight + tuning - native mod; installed as
;                                         Binaries/BetterFlight.ini
;
;  Key names are No Man's Sky TkInputEnum names:
;    KeyA..KeyZ  Key0..Key9  Space  LShift RShift  LCtrl RCtrl  LAlt RAlt
;    Tab Enter Escape Backspace  Up Down Left Right  F1..F12
;    Insert Delete Home End PageUp PageDown  Mouse1..Mouse5
;    Comma Period Slash Semicolon Apostrophe LeftSquare RightSquare Grave
;
;  Layout follows Star Citizen defaults where NMS has an equivalent.
; =============================================================================

[flight]
; New 6DOF translation. Handled entirely by BetterFlight.dll.
; Any action can take several inputs, including mouse buttons (Mouse1-Mouse5):
;   StrafeLeft = KeyA, Mouse4
StrafeLeft   = KeyA
StrafeRight  = KeyD
StrafeUp     = Space
StrafeDown   = LCtrl
; Coupled (default at every launch): release the throttle and strafe keys and
; the ship brakes to a stop in every direction. Decoupled: nothing slows you
; down - keep your speed and turn or flip freely. Press again to re-couple.
DecoupleKey  = KeyZ
; Turns all of BetterFlight.dll's flight features on/off, for A/B comparison.
ToggleKey    = F8

[coupled]
; Coupled flight (Star Citizen model): the ship holds zero velocity on every axis
; you aren't commanding. Release W/S/boost and it brakes to a full stop.
; These are the game's own throttle keys - list the same keys you fly with.
ThrustKey      = KeyW
BrakeKey       = KeyS
BoostKey       = LShift
; Braking forward motion uses retro thrusters (weaker); braking backward motion
; uses the main thrusters. m/s^2
RetroAccel     = 60
MainAccel      = 120
; Hand-off: let the game fly the ship during automated manoeuvres instead of
; braking against them. Triggered by these keys (land, pulse, follow) ...
AutopilotKeys          = KeyN, KeyB, KeyF
AutopilotSeconds       = 6
; ... or by the game accelerating you forward harder than this with no throttle
; input (pulse spool-up). Braking, e.g. after releasing boost, never counts. m/s^2 ...
AutopilotAccel         = 300
; ... or an impact this hard on any axis (1 s, so a bounce isn't undone) ...
ImpactAccel            = 6000
; ... or, below MomentumMinSpeed, a sideways/vertical push harder than this
; (take-off, landing assists).
LowSpeedAutopilotAccel = 20

[tuning]
; BetterFlight.dll re-reads this file about once a second while you fly,
; so you can edit values with the game running.
;
; Thruster acceleration in m/s^2 while a strafe key is held.
; For scale: vanilla space cruise is ~180 m/s.
LateralAccel   = 70
VerticalAccel  = 55
; Strafe will not push the lateral (or vertical) speed component past this.
MaxStrafeSpeed = 140
; Real momentum. Above MomentumMinSpeed, anything the game does to your
; velocity on an axis you aren't controlling is ignored - its steering toward
; the nose, drift pull, throttle wind-down - so the ship keeps moving the way
; you sent it. 0 = vanilla. Below MomentumMinSpeed the game handles landing,
; take-off and hovering as normal.
WorldMomentum    = 1
MomentumMinSpeed = 30
; Safety limit for sideways + vertical drift, m/s. Forward speed (boost, pulse)
; is not limited. High enough to flip at full boost speed in decoupled.
DriftSpeedCap    = 3500
; Flight retune: lets the ship stop, stops mouse turns from banking the ship and
; keeps momentum. Applied in memory on top of the game's flight data - vanilla
; or another mod's (e.g. a balance overhaul). 0 = leave the flight data alone.
; F8 also switches it off and on.
FlightRetune     = 1
; Flip if A/D or Space/LCtrl turn out to push the wrong way.
InvertLateral  = 0
InvertVertical = 0
; 1 = write per-second flight diagnostics to Binaries/BetterFlight.log
Debug          = 1

[remap]
; Vanilla ShipControls actions moved OFF the flight keys above.
; Every existing binding of the action is replaced by what you list here.
; List several inputs to bind more than one, mouse buttons included:
;   Ship_RollLeft  = KeyQ, Mouse4
;   Ship_RollRight = KeyE, Mouse5
;
; Roll leaves A/D. Side effect worth knowing: the game fires pulse jump when
; BOTH roll actions are held, so that chord moves from A+D to Q+E.
Ship_RollLeft          = KeyQ
Ship_RollRight         = KeyE
; Pulse jump leaves Space (SC: quantum drive = B).
Ship_PulseJump         = KeyB
; E was quadruple-bound. Split it: landing on N (SC: landing mode = N),
; everything else interaction-like on F (SC: interact = F).
Ship_Land              = KeyN
Ship_Exit              = KeyF
Player_TagMarker       = KeyF
Ship_AutoFollow_Toggle = KeyF
